# M1 development-branch CI only; not a WEQUIP Production F certification.
# main and other branches remain unchanged.
name: WEQUIP M1 offline provider smoke
on:
  push:
    branches:
      - work/wequip-m1-auto-ci
    paths:
      - .github/workflows/m1-offline-smoke.yml
      - source/**
      - scripts/**
      - tests/**
      - RELEASE_CANDIDATE_MANIFEST.json
permissions:
  contents: read
jobs:
  m1-offline-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout pinned action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Runtime information
        run: python3 --version
      - name: Exact-source synthetic smoke
        run: python3 -B scripts/m1_offline_smoke.py
      - name: Focused negative fail-closed tests
        run: python3 -B -m unittest discover -s tests -v
